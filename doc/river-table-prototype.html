        <div class="local-cards" aria-label="你的手牌 A 黑桃与 J 黑桃"><div class="card"><span>A</span><span class="suit">♠</span></div><div class="card"><span>J</span><span class="suit">♠</span></div></div><div class="table-tools"><button class="round" aria-label="牌桌音效" data-panel="sound"><svg class="icon"><path d="M4 10v4h4l5 4V6L8 10zM17 9a4 4 0 0 1 0 6"/></svg></button><button class="round" aria-label="牌桌设置" data-panel="tableSettings"><svg class="icon"><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/><circle cx="12" cy="12" r="4"/></svg></button></div>
      </div>
      <div class="action-dock"><div class="raise-bar"><button id="minus" aria-label="减少加注额">−</button><output id="raiseAmount">160</output><button id="plus" aria-label="增加加注额">＋</button></div><div class="game-actions"><button class="fold" id="fold">弃牌</button><button class="call" id="call">跟注<small>160</small></button><button class="raise" data-panel="raise">加注</button></div></div>
    </section>
    <div class="backdrop" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle"><section class="sheet"><header class="sheet-head"><h2 id="panelTitle">功能</h2><button class="close" id="closePanel" aria-label="关闭">×</button></header><div id="panelContent"></div></section></div>
  </main>
  <script>
    const state={screen:'home',raise:160,balances:{'深海玩家':2500,'潮汐玩家':2180,'暗流':1760,'珊瑚玩家':1320},topups:[{player:'暗流',amount:500,time:'今天 20:48',note:'牌局补充积分'},{player:'潮汐玩家',amount:300,time:'昨天 21:06',note:'管理员分配'}]}; const toastEl=document.querySelector('#toast');let toastTimer;
    const panel=document.querySelector('#panel'),panelTitle=document.querySelector('#panelTitle'),panelContent=document.querySelector('#panelContent');
    const icon={lock:'<svg class="icon"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',link:'<svg class="icon"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"/></svg>'};
    function toast(message){toastEl.textContent=message;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2600)}
    function showScreen(id){state.screen=id;document.querySelectorAll('.screen').forEach(el=>el.classList.toggle('active',el.id===id));closePanel()}
    function selectChoices(){panelContent.querySelectorAll('.choice').forEach(choice=>{choice.setAttribute('aria-pressed',choice.classList.contains('selected'));choice.addEventListener('click',()=>{const group=choice.closest('.choices');group.querySelectorAll('.choice').forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-pressed','false')});choice.classList.add('selected');choice.setAttribute('aria-pressed','true')})})}
    function bindToggles(){panelContent.querySelectorAll('.toggle').forEach(toggle=>toggle.addEventListener('click',()=>{toggle.classList.toggle('on');toggle.setAttribute('aria-pressed',toggle.classList.contains('on'))}))}
    function copy(value,label){if(navigator.clipboard&&location.protocol!=='file:'){navigator.clipboard.writeText(value)}toast(label+'已复制')}
    const templates={
      settings:{title:'设置',html:`<button class="setting-row" id="openProfile"><svg class="icon" style="color:#f1c65e"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.4-4 4-6 8-6s6.6 2 8 6"/></svg><span>个人信息<small>昵称、头像与账号安全</small></span><b>›</b></button><button class="setting-row" id="openSound"><svg class="icon" style="color:#f1c65e"><path d="M4 10v4h4l5 4V6L8 10zM17 9a4 4 0 0 1 0 6M19.5 6.5a7 7 0 0 1 0 11"/></svg><span>音效设置<small>牌局音效、震动与背景音乐</small></span><b>›</b></button>`},
      create:{title:'创建私人房',html:`<p>创建者将自动成为管理员，可为成员分配初始积分并在牌局中补充积分。</p><label class="form-label" for="roomName">房间名称</label><input id="roomName" class="field" value="深海玩家的牌局" maxlength="20"><span class="form-label">人数</span><div class="choices"><button class="choice selected">6 人桌</button><button class="choice">9 人桌</button></div><span class="form-label">盲注</span><div class="choices"><button class="choice selected">20 / 40</button><button class="choice">10 / 20</button></div><label class="form-label" for="initialScore">每位玩家初始积分</label><input id="initialScore" class="field" type="number" inputmode="numeric" min="100" step="100" value="1500"><button class="sheet-primary" id="makeRoom">生成邀请码</button>`},
      join:{title:'加入私人房',html:`<p>输入好友分享的邀请码，加入后该房间会保留在「我的牌局」中。</p><label class="form-label" for="inviteCode">邀请码</label><input id="inviteCode" class="field" inputmode="text" autocapitalize="characters" placeholder="例如 DEEP-728" maxlength="12"><button class="sheet-primary" id="joinRoom">加入牌局</button>`},
      invite:{title:'邀请好友',html:`<div class="invite-card"><span class="eyebrow">深海玩家的私人牌局</span><div class="invite-code">DEEP-728</div><p>20 / 40 · 6 人桌 · 仅受邀玩家可进入</p><div class="copy-row"><button id="copyCode">复制邀请码</button><button id="copyLink">复制邀请链接</button></div></div><p style="margin-top:14px">将邀请码或邀请链接发送给好友；房主可随时在牌桌设置中关闭邀请。</p>`},
      profile:{title:'个人信息设置',html:`<label class="form-label" for="nickname">昵称</label><input id="nickname" class="field" value="深海玩家" maxlength="16"><span class="form-label">选择头像</span><div class="choices"><button class="choice selected">深海蓝</button><button class="choice">珊瑚橙</button><button class="choice">翡翠绿</button><button class="choice">月光银</button></div><button class="sheet-primary" id="saveProfile">保存个人信息</button><button class="text-action" id="changePassword">修改密码 ›</button><button class="danger" id="deleteAccount">注销账号</button>`},
      password:{title:'修改密码',html:`<p>为账户设置新的登录密码。原型不会保存真实密码。</p><label class="form-label" for="currentPassword">当前密码</label><input id="currentPassword" class="field" type="password" autocomplete="current-password"><label class="form-label" for="newPassword">新密码</label><input id="newPassword" class="field" type="password" autocomplete="new-password"><label class="form-label" for="repeatPassword">确认新密码</label><input id="repeatPassword" class="field" type="password" autocomplete="new-password"><button class="sheet-primary" id="savePassword">更新密码</button>`},
      deleteAccount:{title:'注销账号',html:`<div class="danger-panel"><p>注销后将无法恢复个人资料、受邀房间和积分记录。此原型不会真正注销账号。</p></div><label class="form-label" for="deleteConfirm">输入“注销”以确认</label><input id="deleteConfirm" class="field" placeholder="注销"><button class="danger" id="confirmDelete" disabled>确认注销账号</button>`},
      sound:{title:'音效设置',html:`<div class="setting-row"><span>牌局音效<small>发牌、下注与轮到你</small></span><button class="toggle on" aria-pressed="true" aria-label="牌局音效已开启"><i></i></button></div><div class="setting-row"><span>震动反馈<small>轮到你行动时轻触提醒</small></span><button class="toggle on" aria-pressed="true" aria-label="震动反馈已开启"><i></i></button></div><div class="setting-row"><span>背景音乐<small>仅在首页播放</small></span><button class="toggle" aria-pressed="false" aria-label="背景音乐已关闭"><i></i></button></div><button class="sheet-primary" id="saveSound">保存音效设置</button>`},
      tableSettings:{title:'牌桌设置',html:`<div class="setting-row"><span>允许好友邀请<small>已有房间成员可分享邀请链接</small></span><button class="toggle on" aria-pressed="true" aria-label="允许好友邀请已开启"><i></i></button></div><div class="setting-row"><span>展示入座提示<small>好友进出时显示简短通知</small></span><button class="toggle on" aria-pressed="true" aria-label="展示入座提示已开启"><i></i></button></div><button class="sheet-primary" id="manageScores">管理成员积分</button><button class="text-action" id="saveTable">保存牌桌设置</button>`},
      raise:{title:'选择加注额',html:`<span class="form-label">本次加注</span><div class="choices"><button class="choice">320 · 1/4 底池</button><button class="choice selected">640 · 1/2 底池</button><button class="choice">960 · 3/4 底池</button><button class="choice">1,280 · 满池</button></div><button class="sheet-primary" id="confirmRaise">加注 640</button>`}
    };
    function setPanel(title,html){panelTitle.textContent=title;panelContent.innerHTML=html;panel.classList.add('open')}
    function scoreRows(){return Object.entries(state.balances).map(([player,score])=>`<div class="member-card"><i class="avatar"></i><div class="info"><b>${player}${player==='深海玩家'?'（你）':''}</b><span>${player==='深海玩家'?'管理员':'已加入房间'}</span></div><strong class="score">${score.toLocaleString()}</strong>${player==='深海玩家'?'':`<button class="add-score" data-credit="${player}">补充</button>`}</div>`).join('')}
    function topupRows(){return state.topups.length?state.topups.map(item=>`<div class="log"><b>${item.player} <em>+${item.amount.toLocaleString()}</em></b><span>${item.note} · ${item.time}</span></div>`).join(''):'<div class="empty">暂无补充积分记录</div>'}
    function bindCredits(){panelContent.querySelectorAll('[data-credit]').forEach(button=>button.addEventListener('click',()=>openCredit(button.dataset.credit)))}
    function openCredit(player){setPanel('补充积分 · '+player,`<p>本次操作会记录在该房间的补充积分记录中。</p><label class="form-label" for="creditAmount">补充积分</label><input id="creditAmount" class="field" type="number" inputmode="numeric" min="100" step="100" value="500"><div class="choices" style="margin-top:10px"><button class="choice" data-credit-preset="300">+300</button><button class="choice selected" data-credit-preset="500">+500</button><button class="choice" data-credit-preset="1000">+1,000</button><button class="choice" data-credit-preset="2000">+2,000</button></div><button class="sheet-primary" id="applyCredit">继续</button>`);selectChoices();panelContent.querySelectorAll('[data-credit-preset]').forEach(button=>button.addEventListener('click',()=>{panelContent.querySelector('#creditAmount').value=button.dataset.creditPreset}));panelContent.querySelector('#applyCredit').addEventListener('click',()=>{const amount=Number(panelContent.querySelector('#creditAmount').value);if(!Number.isFinite(amount)||amount<100){toast('请输入至少 100 积分');panelContent.querySelector('#creditAmount').focus();return}const next=state.balances[player]+amount;setPanel('确认补充积分',`<div class="danger-panel"><p>确认向 <strong>${player}</strong> 补充 <strong>+${amount.toLocaleString()}</strong> 积分？</p><p style="margin-top:6px">当前 ${state.balances[player].toLocaleString()} → 补充后 ${next.toLocaleString()}</p></div><button class="sheet-primary" id="confirmCredit">确认补充</button><button class="text-action" id="backCredit">返回修改金额</button>`);panelContent.querySelector('#confirmCredit').addEventListener('click',()=>{state.balances[player]=next;state.topups.unshift({player,amount,time:'刚刚',note:'管理员补充'});closePanel();toast('已向 '+player+' 补充 '+amount.toLocaleString()+' 积分')});panelContent.querySelector('#backCredit').addEventListener('click',()=>openCredit(player))})}
    function openRoomAdmin(){setPanel('房间管理',`<p>你是此房间的管理员，可查看所有成员积分并在牌局过程中补充积分。</p><h3 class="subhead">成员积分</h3><div class="member-list">${scoreRows()}</div><button class="sheet-primary" id="openGame">进入牌桌</button><button class="text-action" id="openInvite">查看邀请码与邀请链接 ›</button><button class="text-action" id="openAdminHistory">查看历史牌局与补充记录 ›</button>`);bindCredits();panelContent.querySelector('#openGame').addEventListener('click',()=>{closePanel();showScreen('table')});panelContent.querySelector('#openInvite').addEventListener('click',()=>openPanel('invite'));panelContent.querySelector('#openAdminHistory').addEventListener('click',openAdminHistory)}
    function openMemberPoints(){setPanel('我的积分',`<div class="invite-card"><span class="eyebrow">周五好友夜 · 受邀玩家</span><div class="invite-code">1,560</div><p>当前可用积分 · 仅你本人可见</p></div><p style="margin-top:14px">房间成员的积分由管理员管理；你可以在历史牌局中查看自己的积分变化。</p><button class="sheet-primary" id="openMemberHistory">查看我的历史牌局</button>`);panelContent.querySelector('#openMemberHistory').addEventListener('click',openMemberHistory)}
    function openAdminHistory(name='深海玩家的牌局'){setPanel(name,`<p>管理员视图 · 该局已结束。仅显示当前点击牌局的结算与积分记录。</p><h3 class="subhead">本局最终成员积分</h3><div class="member-list">${scoreRows()}</div><h3 class="subhead">本局补充积分记录</h3><div class="log-list">${topupRows()}</div>`);bindCredits()}
    function openMemberHistory(name='周五好友夜'){setPanel(name,`<p>受邀玩家视图 · 仅显示你在当前牌局的最终积分与个人补充历史。</p><div class="invite-card"><span class="eyebrow">本局最终积分</span><div class="invite-code">1,560</div><p>仅你本人可见</p></div><h3 class="subhead">本局补充积分历史</h3><div class="log-list"><div class="log"><b>管理员分配 <em>+1,500</em></b><span>开局前 · 初始积分</span></div><div class="log"><b>管理员补充 <em>+300</em></b><span>第 16 手 · 牌局补充</span></div></div>`)}
    function openPanel(name){if(name==='roomAdmin'){openRoomAdmin();return}if(name==='memberPoints'){openMemberPoints();return}if(name==='adminHistory'){openAdminHistory();return}if(name==='memberHistory'){openMemberHistory();return}const t=templates[name];if(!t)return;panelTitle.textContent=t.title;panelContent.innerHTML=t.html;panel.classList.add('open');selectChoices();bindToggles();const done=message=>{closePanel();toast(message)};
      panelContent.querySelector('#makeRoom')?.addEventListener('click',()=>{const initial=Number(panelContent.querySelector('#initialScore').value);if(!Number.isFinite(initial)||initial<100){toast('初始积分至少为 100');panelContent.querySelector('#initialScore').focus();return}state.balances['深海玩家']=initial;panelTitle.textContent='房间已创建';panelContent.innerHTML=`<div class="invite-card">${icon.lock}<span class="eyebrow" style="display:block;margin-top:8px">你已成为房间管理员</span><div class="invite-code">DEEP-728</div><p>已为你分配 ${initial.toLocaleString()} 初始积分，可随时为成员补充积分。</p><div class="copy-row"><button id="copyCode">复制邀请码</button><button id="copyLink">复制邀请链接</button></div></div><button class="sheet-primary" id="finishCreate">进入房间管理</button>`;bindDynamicCopy();panelContent.querySelector('#finishCreate').addEventListener('click',openRoomAdmin)});
      panelContent.querySelector('#joinRoom')?.addEventListener('click',()=>{const code=panelContent.querySelector('#inviteCode').value.trim().toUpperCase();if(!code){toast('请输入邀请码');panelContent.querySelector('#inviteCode').focus();return}if(code!=='DEEP-728'){toast('邀请码无效或已过期，请联系房主');panelContent.querySelector('#inviteCode').focus();return}done('已加入 '+code);showScreen('table')});
      panelContent.querySelector('#saveProfile')?.addEventListener('click',()=>done('个人信息已保存'));
      panelContent.querySelector('#openProfile')?.addEventListener('click',()=>openPanel('profile'));
      panelContent.querySelector('#openSound')?.addEventListener('click',()=>openPanel('sound'));
      panelContent.querySelector('#changePassword')?.addEventListener('click',()=>openPanel('password'));
      panelContent.querySelector('#deleteAccount')?.addEventListener('click',()=>openPanel('deleteAccount'));
      panelContent.querySelector('#savePassword')?.addEventListener('click',()=>{const current=panelContent.querySelector('#currentPassword').value;const next=panelContent.querySelector('#newPassword').value;const repeat=panelContent.querySelector('#repeatPassword').value;if(!current||!next||!repeat){toast('请填写全部密码字段');return}if(next!==repeat){toast('两次输入的新密码不一致');panelContent.querySelector('#repeatPassword').focus();return}done('密码已更新（原型模拟）')});
      panelContent.querySelector('#deleteConfirm')?.addEventListener('input',event=>{panelContent.querySelector('#confirmDelete').disabled=event.target.value.trim()!=='注销'});
      panelContent.querySelector('#confirmDelete')?.addEventListener('click',()=>done('账号注销流程已确认（原型模拟）'));
      panelContent.querySelector('#saveSound')?.addEventListener('click',()=>done('音效设置已保存'));
      panelContent.querySelector('#manageScores')?.addEventListener('click',openRoomAdmin);
      panelContent.querySelector('#saveTable')?.addEventListener('click',()=>done('牌桌设置已保存'));
      panelContent.querySelector('#confirmRaise')?.addEventListener('click',()=>{state.raise=640;document.querySelector('#raiseAmount').textContent=state.raise;done('已加注 640 · 等待好友回应')});
      bindDynamicCopy();
    }
    function bindDynamicCopy(){panelContent.querySelector('#copyCode')?.addEventListener('click',()=>copy('DEEP-728','邀请码'));panelContent.querySelector('#copyLink')?.addEventListener('click',()=>copy('https://rivertable.example/join/DEEP-728','邀请链接'))}
    function closePanel(){panel.classList.remove('open')}
    document.querySelectorAll('[data-screen]').forEach(el=>el.addEventListener('click',()=>showScreen(el.dataset.screen)));document.querySelectorAll('[data-panel]').forEach(el=>el.addEventListener('click',()=>openPanel(el.dataset.panel)));document.querySelectorAll('[data-history-name]').forEach(el=>el.addEventListener('click',()=>{const name=el.dataset.historyName;el.dataset.historyRole==='admin'?openAdminHistory(name):openMemberHistory(name)}));document.querySelector('#closePanel').addEventListener('click',closePanel);panel.addEventListener('click',e=>{if(e.target===panel)closePanel()});
    document.querySelector('#minus').addEventListener('click',()=>{state.raise=Math.max(40,state.raise-40);document.querySelector('#raiseAmount').textContent=state.raise});document.querySelector('#plus').addEventListener('click',()=>{state.raise=Math.min(1560,state.raise+40);document.querySelector('#raiseAmount').textContent=state.raise});document.querySelector('#fold').addEventListener('click',()=>{document.querySelector('#fold').disabled=true;document.querySelector('#fold').style.opacity='.45';toast('已弃牌 · 等待本手结束')});document.querySelector('#call').addEventListener('click',()=>toast('已跟注 160 · 等待好友回应'));
    addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
  </script>
</body>
</html>
